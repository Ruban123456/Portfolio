{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/portfolio.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #000;
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        .gold-text {
            color: #2611e0;
        }

        /* Navbar */
        .navbar {
            background-color: #000;
            border-bottom: 1px solid #2611e0;
        }

        .nav-link {
            color: white !important;
            margin-left: 15px;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #2611e0 !important;
        }

        /* Buttons */
        .gold-btn {
            background-color: #2611e0;
            color: black;
            border: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .gold-btn:hover {
            transform: scale(1.05);
        }

        /* Cards */
        .card {
            background-color: #111;
            border: 1px solid #2611e0;
            border-radius: 12px;
        }

        /* Inputs */
        input, textarea {
            background-color: #000 !important;
            color: white !important;
            border: 1px solid #2611e0 !important;
        }

        input:focus, textarea:focus {
            box-shadow: 0 0 8px #2611e0 !important;
            border-color: #2611e0 !important;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            overflow: hidden;
        }

        .animated-bg span {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59,130,246,0.3) 0%, transparent 70%);
            animation: float 25s linear infinite;
        }

        .animated-bg span:nth-child(1) {
            width: 500px;
            height: 500px;
            top: -150px;
            left: -150px;
        }

        .animated-bg span:nth-child(2) {
            width: 400px;
            height: 400px;
            bottom: -120px;
            right: -100px;
        }

        .animated-bg span:nth-child(3) {
            width: 300px;
            height: 300px;
            top: 40%;
            left: 60%;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-60px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }

        footer {
            border-top: 1px solid #2611e0;
            margin-top: 60px;
            padding: 20px 0;
            text-align: center;
            color: #aaa;
        }
    </style>
</head>

<body>

    <!-- Animated Background -->
    <div class="animated-bg">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand gold-text fw-bold" href="{% url 'home' %}">
                MyPortfolio
            </a>

            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'projects' %}">Projects</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'contact' %}">Contact</a>
                    </li>

                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
                        </li>

                        <li class="nav-item">
                            <form action="{% url 'logout' %}" method="POST">
                                {% csrf_token %}
                                <button type="submit" class="nav-link btn btn-link gold-text" style="text-decoration:none;">
                                    Logout
                                </button>
                            </form>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link gold-text" href="{% url 'login' %}">Login</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link gold-text" href="{% url 'signup' %}">Sign Up</a>
                        </li>
                    {% endif %}

                </ul>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="container mt-5">
        {% block content %}
        {% endblock %}
    </div>

    <!-- FOOTER -->
    <footer>
        © 2026 My Portfolio | Built with Django
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
